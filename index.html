<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orbital Pulse - Offline Satellite & UAP Tracker</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Satellite.js (SGP4/SDP4 Orbital Mechanics) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/5.0.0/satellite.min.js"></script>

    <!-- Three.js for 3D Globe Mode -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background-color: #030712; color: #f3f4f6; 
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; 
        }

        #map, #canvas3d { 
            height: 100%; width: 100%; position: absolute; top: 0; left: 0; 
        }

        #canvas3d { z-index: 2; display: none; pointer-events: auto; }
        #map { z-index: 1; }

        .glass-panel {
            background: rgba(10, 15, 30, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 0.75rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.8);
        }

        .hud-scroll {
            max-height: calc(100vh - 110px);
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #38bdf8 rgba(10, 15, 30, 0.5);
        }

        .hud-scroll::-webkit-scrollbar { width: 3px; }
        .hud-scroll::-webkit-scrollbar-thumb { background-color: #38bdf8; border-radius: 2px; }

        .hud-collapsed .hud-details { display: none !important; }
        .hud-collapsed { max-height: 48px !important; overflow: hidden !important; }

        .pulse-beacon {
            width: 7px; height: 7px; background-color: #10b981; border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.8);
            animation: pulse-ring 1.8s infinite cubic-bezier(0.66, 0, 0, 1);
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.8); }
            70% { transform: scale(1.15); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .sat-marker-icon {
            display: flex; align-items: center; justify-content: center;
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.9));
        }

        /* Anti-Flicker Static Vector Tile Styling */
        .vector-map-tiles {
            filter: invert(100%) hue-rotate(180deg) brightness(85%) contrast(95%);
        }

        /* Infrared / Night Vision Filter Mode */
        .ir-mode {
            filter: sepia(100%) hue-rotate(300deg) saturate(500%) brightness(75%) contrast(150%) !important;
        }
    </style>
</head>

        function initMap() {
            // Anti-Flicker Static Vector Tile Configuration with Hardware Acceleration and Instant Tile Caching
            map = L.map('map', {
                zoomControl: false,
                worldCopyJump: false,
                minZoom: 2,
                maxZoom: 10,
                inertia: false,
                fadeAnimation: false,
                zoomAnimation: false,
                markerZoomAnimation: false
            }).setView([15, 0], 2);

            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // Vector-styled Cartographic Dark Tiles with aggressive caching to eliminate blur/whitening flashes
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                className: 'vector-map-tiles',
                maxZoom: 19,
                keepBuffer: 32,
                updateWhenIdle: false,
                updateWhenZooming: false,
                subdomains: ['a', 'b', 'c']
            }).addTo(map);
        }

        function toggleHudMinimize() {
            const hud = document.getElementById('hud-panel');
            const icon = document.getElementById('hud-toggle-icon');
            isHudMinimized = !isHudMinimized;

            if (isHudMinimized) {
                hud.classList.add('hud-collapsed');
                icon.innerText = "➕ Max";
            } else {
                hud.classList.remove('hud-collapsed');
                icon.innerText = "➖ Min";
            }
        }

        function toggleInfraredMode() {
            isIrActive = !isIrActive;
            const body = document.getElementById('app-body');
            const btn = document.getElementById('ir-btn');
            if (isIrActive) {
                body.classList.add('ir-mode');
                btn.className = "px-2 py-1 rounded bg-red-950 border border-red-600 text-red-300 text-xs font-semibold";
                showToast("IR Night Vision Enabled");
            } else {
                body.classList.remove('ir-mode');
                btn.className = "px-2 py-1 rounded bg-slate-900 border border-slate-700 text-slate-300 hover:text-emerald-400 text-xs font-semibold";
                showToast("Standard Optics Restored");
            }
        }

        async function loadSatellite(query) {
            const cleanQuery = query.trim();
            let tleRecord = EMBEDDED_TLE_DB[cleanQuery];

            if (!tleRecord) {
                // Search by name in embedded DB
                const foundKey = Object.keys(EMBEDDED_TLE_DB).find(k => EMBEDDED_TLE_DB[k].name.toLowerCase().includes(cleanQuery.toLowerCase()));
                if (foundKey) {
                    tleRecord = EMBEDDED_TLE_DB[foundKey];
                } else {
                    // Fallback to CelesTrak Live API if online
                    try {
                        const response = await fetch(`https://celestrak.org/NORAD/elements/gp.php?CATNR=${cleanQuery}&FORMAT=TLE`);
                        if (response.ok) {
                            const text = await response.text();
                            const lines = text.trim().split('\n').map(l => l.trim()).filter(l => l.length > 0);
                            if (lines.length >= 3) {
                                tleRecord = { name: lines[0], line1: lines[1], line2: lines[2] };
                                document.getElementById('source-status').innerText = "Live CelesTrak API";
                            }
                        }
                    } catch (e) {
                        // Offline or failed fetch
                    }
                }
            }

            if (!tleRecord) {
                // Default fallback if not found
                tleRecord = EMBEDDED_TLE_DB["48274"];
                showToast("Satellite not found in cache. Loaded Tiangong.");
            } else {
                if (EMBEDDED_TLE_DB[cleanQuery]) {
                    document.getElementById('source-status').innerText = "Embedded Offline DB";
                }
            }

            currentRawTle = {
                name: tleRecord.name,
                line1: tleRecord.line1,
                line2: tleRecord.line2,
                norad: tleRecord.line1.substring(2, 7).trim()
            };

            parseAndStartTracking();
        }

        function parseAndStartTracking() {
            currentSatrec = satellite.twoline2satrec(currentRawTle.line1, currentRawTle.line2);
            extractKeplerianElements(currentSatrec);

            if (orbitPolyline) map.removeLayer(orbitPolyline);
            orbitPolyline = null;
            if (mapMarker) map.removeLayer(mapMarker);
            mapMarker = null;

            if (orbitLine3d) {
                orbitLine3d.geometry.dispose();
                orbitLine3d.geometry = new THREE.BufferGeometry();
            }

            if (trackingTimer) clearInterval(trackingTimer);

            isFirstTrackingUpdate = true; // Trigger teleport/pan on first update of new sat
            updateTelemetryAndMap();
            calculateOrbitPath();

            trackingTimer = setInterval(() => {
                updateTelemetryAndMap();
            }, 1000);
        }

        function extractKeplerianElements(satrec) {
            if (!satrec) return;
            const rad2deg = 180 / Math.PI;
            document.getElementById('kep-inc').innerText = `${(satrec.inclo * rad2deg).toFixed(2)}°`;
            document.getElementById('kep-ecc').innerText = satrec.ecco.toFixed(6);
            document.getElementById('norad-id').innerText = currentRawTle.norad || '-----';
            document.getElementById('target-name').innerText = currentRawTle.name || 'SATELLITE';
        }

        function updateTelemetryAndMap() {
            if (!currentSatrec) return;
            const now = new Date();
            document.getElementById('meta-time').innerText = now.toISOString().substring(11, 19) + ' UTC';

            const positionAndVelocity = satellite.propagate(currentSatrec, now);
            const gmst = satellite.gstime(now);
            if (!positionAndVelocity.position) return;

            const positionEci = positionAndVelocity.position;
            const velocityEci = positionAndVelocity.velocity;
            const positionGd = satellite.eciToGeodetic(positionEci, gmst);
            const lat = satellite.degreesLat(positionGd.latitude);
            const lng = satellite.degreesLong(positionGd.longitude);
            const altKm = positionGd.height;
            const altMiles = altKm * 0.621371;

            const speedKms = Math.sqrt(velocityEci.x ** 2 + velocityEci.y ** 2 + velocityEci.z ** 2);
            const speedMph = speedKms * 3600 * 0.621371; // Strictly miles per hour

            const R_earth = 6371;
            const footprintRadKm = R_earth * Math.acos(R_earth / (R_earth + altKm));

            document.getElementById('lat-val').innerText = `${lat >= 0 ? '+' : ''}${lat.toFixed(1)}°`;
            document.getElementById('lng-val').innerText = `${lng >= 0 ? '+' : ''}${lng.toFixed(1)}°`;
            document.getElementById('alt-val').innerText = `${Math.round(altMiles).toLocaleString()} mi`;
            document.getElementById('vel-val').innerText = `${Math.round(speedMph).toLocaleString()} mph`;

            const latLng = [lat, lng];

            // Auto-teleport/pan map view to the selected satellite upon selection or change
            if (isFirstTrackingUpdate) {
                if (currentViewMode === '2d') {
                    map.flyTo(latLng, 4, { duration: 1.5 });
                }
                isFirstTrackingUpdate = false;
            }

            if (!mapMarker) {
                const satSvgIcon = L.divIcon({
                    className: 'sat-marker-icon',
                    html: `
                        <div class="relative flex items-center justify-center">
                            <div class="absolute w-5 h-5 rounded-full bg-sky-500/30 animate-ping"></div>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.5">
                                <circle cx="12" cy="12" r="3" fill="#0284c7"/>
                                <path d="M4.5 4.5l4 4M19.5 19.5l-4-4M19.5 4.5l-4 4M4.5 19.5l4-4"/>
                            </svg>
                        </div>
                    `,
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                });
                mapMarker = L.marker(latLng, { icon: satSvgIcon }).addTo(map);
            } else {
                mapMarker.setLatLng(latLng);
            }

            if (!footprintCircle) {
                footprintCircle = L.circle(latLng, {
                    radius: footprintRadKm * 1000,
                    color: '#38bdf8', weight: 1, opacity: 0.3, fillColor: '#0284c7', fillOpacity: 0.05
                }).addTo(map);
            } else {
                footprintCircle.setLatLng(latLng);
                footprintCircle.setRadius(footprintRadKm * 1000);
            }

            if (satMesh3d) {
                const scale = 1.0 / R_earth;
                satMesh3d.position.set(positionEci.x * scale, positionEci.z * scale, -positionEci.y * scale);
                
                // In 3D mode, smoothly tilt camera towards active satellite target on selection
                if (currentViewMode === '3d' && isFirstTrackingUpdate && camera) {
                    camera.position.set(satMesh3d.position.x * 2.2, satMesh3d.position.y * 2.2 + 0.5, satMesh3d.position.z * 2.2);
                    camera.lookAt(satMesh3d.position);
                }
            }
        }

        function calculateOrbitPath() {
            if (!currentSatrec) return;
            const orbitSegments = [];
            let currentSegment = [];
            const now = new Date();
            const past = new Date(now.getTime() - 45 * 60000);
            const points3d = [];

            for (let i = 0; i <= 90; i++) {
                const time = new Date(past.getTime() + i * 60000);
                const posVel = satellite.propagate(currentSatrec, time);
                const gmst = satellite.gstime(time);

                if (posVel.position) {
                    const posGd = satellite.eciToGeodetic(posVel.position, gmst);
                    const lat = satellite.degreesLat(posGd.latitude);
                    const lng = satellite.degreesLong(posGd.longitude);

                    if (currentSegment.length > 0 && Math.abs(lng - currentSegment[currentSegment.length - 1][1]) > 180) {
                        orbitSegments.push(currentSegment);
                        currentSegment = [];
                    }
                    currentSegment.push([lat, lng]);

                    const scale = 1.0 / 6371;
                    points3d.push(new THREE.Vector3(posVel.position.x * scale, posVel.position.z * scale, -posVel.position.y * scale));
                }
            }
            if (currentSegment.length > 0) orbitSegments.push(currentSegment);

            if (orbitPolyline) {
                orbitPolyline.setLatLngs(orbitSegments);
            } else {
                orbitPolyline = L.polyline(orbitSegments, { color: '#38bdf8', weight: 2, opacity: 0.7, dashArray: '4, 4' }).addTo(map);
            }

            if (orbitLine3d && points3d.length > 0) {
                orbitLine3d.geometry.dispose();
                orbitLine3d.geometry = new THREE.BufferGeometry().setFromPoints(points3d);
            }
        }

        function switchView(mode) {
            currentViewMode = mode;
            const mapEl = document.getElementById('map');
            const canvas3dEl = document.getElementById('canvas3d');
            const btn2d = document.getElementById('btn-2d');
            const btn3d = document.getElementById('btn-3d');

            if (mode === '2d') {
                mapEl.style.display = 'block';
                canvas3dEl.style.display = 'none';
                btn2d.className = "px-2 py-1 rounded-md text-sky-400 bg-slate-800 transition-all text-xs";
                btn3d.className = "px-2 py-1 rounded-md text-slate-300 hover:text-white transition-all text-xs";
                if (mapMarker) map.setView(mapMarker.getLatLng(), 4);
            } else {
                mapEl.style.display = 'none';
                canvas3dEl.style.display = 'block';
                btn3d.className = "px-2 py-1 rounded-md text-sky-400 bg-slate-800 transition-all text-xs";
                btn2d.className = "px-2 py-1 rounded-md text-slate-300 hover:text-white transition-all text-xs";
                
                if (!renderer3d) init3dGlobe();
                setTimeout(() => {
                    if (camera && renderer3d) {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer3d.setSize(window.innerWidth, window.innerHeight);
                    }
                }, 50);
            }
        }

        function init3dGlobe() {
            const container = document.getElementById('canvas3d');
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 3);
            
            renderer3d = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer3d.setSize(window.innerWidth, window.innerHeight);
            renderer3d.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer3d.domElement);
            
            if (typeof THREE.OrbitControls !== 'undefined') {
                const controls = new THREE.OrbitControls(camera, renderer3d.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.enablePan = false;
                controls.minDistance = 1.2;
                controls.maxDistance = 10;
            }
            
            // Wireframe Earth Sphere
            const earthGeo = new THREE.SphereGeometry(1, 48, 48);
            const earthMat = new THREE.MeshBasicMaterial({ color: 0x1e293b, wireframe: true, transparent: true, opacity: 0.35 });
            earthMesh = new THREE.Mesh(earthGeo, earthMat);
            scene.add(earthMesh);
            
            // Solid dark inner core
            const solidGeo = new THREE.SphereGeometry(0.98, 32, 32);
            const solidMat = new THREE.MeshBasicMaterial({ color: 0x020617 });
            scene.add(new THREE.Mesh(solidGeo, solidMat));

            // Satellite marker 3D
            const satGeo = new THREE.SphereGeometry(0.025, 16, 16);
            const satMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
            satMesh3d = new THREE.Mesh(satGeo, satMat);
            scene.add(satMesh3d);

            // Orbit line 3D
            const orbitMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.7 });
            orbitLine3d = new THREE.Line(new THREE.BufferGeometry(), orbitMat);
            scene.add(orbitLine3d);
            
            function animate() {
                requestAnimationFrame(animate);
                earthMesh.rotation.y += 0.00015;
                renderer3d.render(scene, camera);
            }
            animate();
            
            window.addEventListener('resize', () => {
                if (camera && renderer3d && currentViewMode === '3d') {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer3d.setSize(window.innerWidth, window.innerHeight);
                }
            });
            
            calculateOrbitPath();
        }

        document.getElementById('sat-select').addEventListener('change', (e) => {
            loadSatellite(e.target.value);
            showToast(`Tracking: ${e.target.options[e.target.selectedIndex].text}`);
        });

        document.getElementById('search-btn').addEventListener('click', () => {
            const q = document.getElementById('custom-search-input').value.trim();
            if (q) loadSatellite(q);
        });

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        window.onload = function() {
            initMap();
            loadSatellite(document.getElementById('sat-select').value);
        };
    </script>
</body>
</html>
